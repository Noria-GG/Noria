<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noria — GT7 Sport Mode Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans+JP:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0C10;
    --panel: #12151B;
    --panel-raised: #171B22;
    --line: #23282F;
    --text: #E7E5E0;
    --text-dim: #8B92A0;
    --amber: #FF7A33;
    --amber-dim: #7A3F1F;
    --cyan: #4FD1E8;
    --radius: 3px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans JP', sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 22px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    position: relative;
    overflow: hidden;
  }

  header::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, var(--amber), var(--cyan));
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .brand-mark {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.06em;
    color: var(--text);
  }

  .brand-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-left: 1px solid var(--line);
    padding-left: 10px;
  }

  .session-info {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    text-align: right;
    line-height: 1.5;
  }
  .session-info span { color: var(--cyan); }

  .clear-btn {
    margin-top: 6px;
    background: none;
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.05em;
    padding: 3px 8px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .clear-btn:hover {
    border-color: var(--amber);
    color: var(--amber);
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .msg {
    max-width: 640px;
    margin-bottom: 16px;
    animation: fade-in 0.25s ease;
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .msg.user { align-self: flex-end; }
  .msg.user .msg-tag { color: var(--text-dim); justify-content: flex-end; }
  .msg.noria .msg-tag { color: var(--amber); }
  .msg.noria .msg-tag::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 6px var(--amber);
  }

  .msg-body {
    padding: 12px 16px;
    border-radius: var(--radius);
    line-height: 1.65;
    font-size: 14.5px;
    white-space: pre-wrap;
  }

  .msg.user .msg-body {
    background: var(--panel-raised);
    border: 1px solid var(--line);
  }

  .msg.noria .msg-body {
    background: linear-gradient(180deg, rgba(255,122,51,0.06), transparent 40%), var(--panel);
    border-left: 2px solid var(--amber);
  }

  .rev-indicator {
    display: flex;
    gap: 3px;
    padding: 14px 0;
    align-items: flex-end;
    height: 20px;
  }
  .rev-indicator span {
    width: 4px;
    background: var(--amber-dim);
    border-radius: 1px;
    animation: rev 1.1s ease-in-out infinite;
  }
  .rev-indicator span:nth-child(1) { height: 6px; animation-delay: 0s; }
  .rev-indicator span:nth-child(2) { height: 10px; animation-delay: 0.1s; }
  .rev-indicator span:nth-child(3) { height: 16px; animation-delay: 0.2s; }
  .rev-indicator span:nth-child(4) { height: 20px; animation-delay: 0.3s; background: var(--amber); }
  .rev-indicator span:nth-child(5) { height: 14px; animation-delay: 0.4s; }
  .rev-indicator span:nth-child(6) { height: 8px; animation-delay: 0.5s; }
  @keyframes rev {
    0%, 100% { opacity: 0.35; transform: scaleY(0.7); }
    50% { opacity: 1; transform: scaleY(1); }
  }

  footer {
    padding: 16px 22px 20px;
    background: var(--panel);
    border-top: 1px solid var(--line);
  }

  .input-row {
    display: flex;
    gap: 10px;
    max-width: 800px;
    margin: 0 auto;
  }

  #input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 12px 14px;
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 14px;
    resize: none;
    outline: none;
  }
  #input:focus { border-color: var(--amber); }

  #send {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: var(--amber);
    color: #12151B;
    border: none;
    padding: 0 22px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: filter 0.15s;
  }
  #send:hover { filter: brightness(1.1); }
  #send:disabled { background: var(--line); color: var(--text-dim); cursor: default; }

  .hint {
    max-width: 800px;
    margin: 8px auto 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--text-dim);
  }

  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="brand-mark">NORIA</span>
    <span class="brand-tag">GT7 · Sport Mode Coach</span>
  </div>
  <div class="session-info">
    SESSION <span>ACTIVE</span><br>MODE: SPORT / ONLINE
    <div><button id="clear-history" class="clear-btn">履歴を消去</button></div>
  </div>
</header>

<main id="chat">
  <div class="msg noria">
    <div class="msg-tag">Noria</div>
    <div class="msg-body">お疲れ様です。今日はどのコースを走っていますか?コーナーで詰まっている場所や、セーフティレーティングの悩みなど、気軽に相談してください。</div>
  </div>
</main>

<footer>
  <div class="input-row">
    <textarea id="input" rows="1" placeholder="例:鈴鹿のデグナーで毎回インベタになれない…"></textarea>
    <button id="send">送信</button>
  </div>
  <div class="hint">Enterで送信 / Shift+Enterで改行</div>
</footer>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

const STORAGE_KEY = 'noria_chat_history';

let history = [];

function saveHistory() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
}

function loadHistory() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (!saved) return;

  try {
    history = JSON.parse(saved);
    history.forEach((msg) => {
      addMessage(msg.role === 'user' ? 'user' : 'noria', msg.content);
    });
  } catch (err) {
    console.error('履歴の読み込みに失敗しました:', err);
    history = [];
  }
}

function clearHistory() {
  if (!confirm('会話履歴を消去しますか?この操作は元に戻せません。')) return;
  history = [];
  localStorage.removeItem(STORAGE_KEY);
  chat.innerHTML = '';
  addMessage('noria', 'お疲れ様です。今日はどのコースを走っていますか?コーナーで詰まっている場所や、セーフティレーティングの悩みなど、気軽に相談してください。');
}

function addMessage(role, text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (role === 'user' ? 'user' : 'noria');
  const tag = document.createElement('div');
  tag.className = 'msg-tag';
  tag.textContent = role === 'user' ? 'You' : 'Noria';
  const body = document.createElement('div');
  body.className = 'msg-body';
  body.textContent = text;
  wrap.appendChild(tag);
  wrap.appendChild(body);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return body;
}

function addRevIndicator() {
  const wrap = document.createElement('div');
  wrap.className = 'msg noria';
  wrap.id = 'rev-temp';
  const tag = document.createElement('div');
  tag.className = 'msg-tag';
  tag.textContent = 'Noria';
  const rev = document.createElement('div');
  rev.className = 'rev-indicator';
  for (let i = 0; i < 6; i++) rev.appendChild(document.createElement('span'));
  wrap.appendChild(tag);
  wrap.appendChild(rev);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function removeRevIndicator() {
  const el = document.getElementById('rev-temp');
  if (el) el.remove();
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  addMessage('user', text);
  history.push({ role: 'user', content: text });
  saveHistory();
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;
  addRevIndicator();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    const data = await res.json();
    removeRevIndicator();

    if (data.error) {
      addMessage('noria', 'エラーが発生しました: ' + data.error);
    } else {
      addMessage('noria', data.reply);
      history.push({ role: 'assistant', content: data.reply });
      saveHistory();
    }
  } catch (err) {
    removeRevIndicator();
    addMessage('noria', '通信エラーが発生しました。サーバーが起動しているか確認してください。');
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

if (localStorage.getItem(STORAGE_KEY)) {
  chat.innerHTML = '';
  loadHistory();
}

document.getElementById('clear-history').addEventListener('click', clearHistory);
sendBtn.addEventListener('click', sendMessage);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
});
</script>

</body>
</html>
